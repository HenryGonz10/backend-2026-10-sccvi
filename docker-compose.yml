services:
  sccvi:
    build: .
    environment:
      DB_HOST: mssql
      DB_PORT: 1433
      DB_DATABASE: sccvi-db
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
      DB_ENCRYPT: 'no'
      DB_TRUST_SERVER_CERTIFICATE: 'true'
      SSO_JWKS_URI: http://sso_app/api/v1/.well-known/jwks.json
      SSO_BASE_URL: http://sso_app/api/v1/
      SSO_SYSTEM_TAG: ${SSO_SYSTEM_TAG:-sccvi}
      SSO_SERVICE_TOKEN: ${SSO_SERVICE_TOKEN:-}
      SSO_SERVICE_USERNAME: ${SSO_SERVICE_USERNAME:-}
      SSO_SERVICE_PASSWORD: ${SSO_SERVICE_PASSWORD:-}
      GEO_BASE_URL: http://geo_app:8100/api/v1/
      NOTIFICATIONS_BASE_URL: http://service-2026-04-notificaciones-productor-1:3010/api/v1/
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DATABASE: sccvi-read
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:${RABBITMQ_ADMIN_PASSWORD}@rabbitmq:5672/%2Fdevelopment}
      PUBLIC_CARD_RATE_LIMIT_REDIS_URL: ${PUBLIC_CARD_RATE_LIMIT_REDIS_URL:-redis://redis:6379/3}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174}
      PUBLIC_CARD_TTL_DAYS: ${PUBLIC_CARD_TTL_DAYS:-365}
    ports: ['8200:8200']
    networks: [plataforma]
networks:
  plataforma:
    external: true
    name: plataforma_local
